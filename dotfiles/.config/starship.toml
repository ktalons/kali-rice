# kali-rice — starship
#
# Ports the macOS host prompt verbatim (the ┌─/└─ box, same directory /
# git_branch / git_status / cmd_duration styling) and adds two HTB modules:
# the current box and the current target IP, so the thing you are pointed at
# is always visible without asking.

format = """
[┌─](bold green)$directory$custom$git_branch$git_status$python$cmd_duration
[└─](bold green)$character"""

add_newline = false
palette = "catppuccin_mocha"

[directory]
style = "bold cyan"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
ahead = "⇡${count}"
behind = "⇣${count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"

[python]
symbol = " "
style = "bold yellow"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# --- HTB -------------------------------------------------------------------
# Both read a single tiny file written by htb-box / htb-target. Cheap enough
# to run every prompt.

[custom.htb_box]
description = "current HTB box"
command = "cat $HOME/.htb/box"
when = "test -s $HOME/.htb/box"
shell = ["sh", "--norc"]
format = "[ $output](bold #cba6f7) "

[custom.htb_target]
description = "current HTB target"
command = "cat $HOME/.htb/target"
when = "test -s $HOME/.htb/target"
shell = ["sh", "--norc"]
format = "[󰓾 $output](bold #f38ba8) "

