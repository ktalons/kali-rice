; kali-rice — polybar
; Catppuccin Mocha. The three htb-* modules are the point of this bar: what
; the VPN is doing, which box is current, and what IP you are pointed at.

[colors]
base      = #1e1e2e
mantle    = #181825
crust     = #11111b
surface0  = #313244
surface1  = #45475a
surface2  = #585b70
text      = #cdd6f4
subtext0  = #a6adc8
overlay0  = #6c7086
red       = #f38ba8
peach     = #fab387
yellow    = #f9e2af
green     = #a6e3a1
teal      = #94e2d5
blue      = #89b4fa
lavender  = #b4befe
mauve     = #cba6f7
transparent = #00000000

[bar/main]
width = 100%
height = 30pt
radius = 0
bottom = false
fixed-center = true

background = ${colors.base}
foreground = ${colors.text}

line-size = 3pt
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
separator = "%{F#45475a}·%{F-}"

; Only fonts that are actually installed belong here. A missing font is not
; an error to polybar — it silently substitutes whatever fontconfig hands
; back (DejaVu Sans, which has no Nerd Font glyphs) and the icons vanish
; with nothing in the log but a "Loaded font" line naming the substitute.
font-0 = JetBrainsMono Nerd Font:style=Medium:size=10;2
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10;2

modules-left = i3 xwindow
modules-center = htbbox htbtarget
modules-right = vpn cpu memory date tray powermenu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

wm-restack = i3
override-redirect = false

; --- workspaces ------------------------------------------------------------
[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false

label-focused = %name%
label-focused-background = ${colors.surface0}
label-focused-foreground = ${colors.lavender}
label-focused-underline = ${colors.lavender}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.overlay0}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.subtext0}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.crust}
label-urgent-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title%
label-maxlen = 45
label-foreground = ${colors.subtext0}

; --- HTB -------------------------------------------------------------------
; Short intervals rather than signals: these read one tiny file each, so
; polling is cheaper than the machinery needed to push an update.

[module/htbbox]
type = custom/script
exec = ~/.config/polybar/scripts/htb-box.sh
interval = 2
format-foreground = ${colors.mauve}
click-left = kitty -e htb-box --list &

[module/htbtarget]
type = custom/script
exec = ~/.config/polybar/scripts/htb-target.sh
interval = 2
format-foreground = ${colors.red}
; Left click copies the target to the clipboard.
click-left = sh -c 'cat ~/.htb/target 2>/dev/null | xclip -selection clipboard' &
click-right = sh -c 'htb-target --clear' &

[module/vpn]
type = custom/script
exec = ~/.config/polybar/scripts/htb-vpn.sh
interval = 3
click-left = kitty -e sh -c 'htb-vpn status; echo; read -r _' &

; --- system ----------------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.peach}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 3
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.teal}
label = %gb_used%/%gb_total%

[module/date]
type = internal/date
interval = 10
date = %H:%M
date-alt = %a %d %b  %H:%M:%S
label = %date%
format-prefix = "󰅐 "
format-prefix-foreground = ${colors.blue}
label-foreground = ${colors.text}

; polybar 3.7 deprecated the bar-level tray-* keys in favour of this module.
; Placing it in modules-right also means the tray sits where we put it rather
; than always being pinned to the bar edge.
[module/tray]
type = internal/tray
tray-spacing = 4
tray-padding = 2
tray-background = ${colors.base}

[module/powermenu]
type = custom/text
format = " 󰐥 "
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.config/polybar/scripts/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
