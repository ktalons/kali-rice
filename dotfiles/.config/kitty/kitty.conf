# kali-rice — kitty
#
# NOTE: kitty renders through OpenGL. Under Parallels with 3D acceleration
# disabled it falls back to llvmpipe software rendering, which works but is
# not snappy. If this feels sluggish, either enable 3D acceleration on the VM
# or switch the i3 `set $term` line to xfce4-terminal.

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
font_size        11.0

cursor_shape                block
cursor_blink_interval       0
scrollback_lines            10000
mouse_hide_wait             2.0
enable_audio_bell           no
window_padding_width        8
confirm_os_window_close     0
remember_window_size        no
initial_window_width        1000
initial_window_height       620

# Software rendering does not benefit from chasing high frame rates.
repaint_delay    12
input_delay      3
sync_to_monitor  yes

tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style slanted

copy_on_select   clipboard
strip_trailing_spaces smart

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab

include catppuccin-mocha.conf
