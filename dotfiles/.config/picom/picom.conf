#
# kali-rice — picom
#
# Tuned for a Parallels ARM guest. Blur is OFF by default: it is the single
# most expensive effect and this VM has 4 GB and a virtio display. Turn it on
# only if `glxinfo -B` reports a real renderer rather than llvmpipe — see the
# EFFECTS block at the bottom.
#

backend = "glx";
vsync = true;

# Only ever needed on real GPUs with broken damage tracking; leaving it off
# saves a full-screen repaint every frame.
use-damage = true;

# --- corners ---------------------------------------------------------------
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'"
];

# --- shadows ---------------------------------------------------------------
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#11111b";
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "_GTK_FRAME_EXTENTS@:c"
];

# --- fading ----------------------------------------------------------------
# Cheap, and it does most of the perceptual work that blur gets credit for.
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;
fade-exclude = [];

# --- opacity ---------------------------------------------------------------
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "92:class_g = 'kitty' && focused",
  "86:class_g = 'kitty' && !focused",
  "95:class_g = 'Rofi'"
];

# --- behaviour -------------------------------------------------------------
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;

wintypes:
{
  tooltip      = { fade = true; shadow = false; focus = true; };
  dock         = { shadow = false; };
  dnd          = { shadow = false; };
  popup_menu   = { shadow = false; opacity = 0.95; };
  dropdown_menu = { shadow = false; opacity = 0.95; };
};

#
# --- EFFECTS ---------------------------------------------------------------
# Uncomment this whole block ONLY if 3D acceleration is genuinely working.
# Check first:
#     glxinfo -B | grep -i "OpenGL renderer"
# If it says llvmpipe, you are on software rendering — leave this alone, it
# will make the desktop stutter under load.
#
# blur-method = "dual_kawase";
# blur-strength = 5;
# blur-background = true;
# blur-background-frame = true;
# blur-background-fixed = false;
# blur-background-exclude = [
#   "window_type = 'dock'",
#   "window_type = 'desktop'",
#   "class_g = 'Polybar'",
#   "_GTK_FRAME_EXTENTS@:c"
# ];
#
