# kali-rice — tmux
# Catppuccin Mocha, with the VPN IP and current box in the status line so a
# detached-and-reattached session still tells you where you are.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
setw -g mode-keys vi

# Splits that keep the current directory — on a box you almost never want
# to land back in $HOME.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# --- Catppuccin Mocha ------------------------------------------------------
%hidden MOCHA_BASE="#1e1e2e"
%hidden MOCHA_MANTLE="#181825"
%hidden MOCHA_CRUST="#11111b"
%hidden MOCHA_SURFACE0="#313244"
%hidden MOCHA_SURFACE1="#45475a"
%hidden MOCHA_TEXT="#cdd6f4"
%hidden MOCHA_SUBTEXT="#a6adc8"
%hidden MOCHA_OVERLAY="#6c7086"
%hidden MOCHA_MAUVE="#cba6f7"
%hidden MOCHA_RED="#f38ba8"
%hidden MOCHA_GREEN="#a6e3a1"
%hidden MOCHA_LAVENDER="#b4befe"

set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify left
set -g status-style "bg=#{MOCHA_MANTLE},fg=#{MOCHA_TEXT}"

set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[bg=#{MOCHA_MAUVE},fg=#{MOCHA_CRUST},bold] #S #[bg=#{MOCHA_MANTLE},fg=#{MOCHA_MAUVE}]#[default] "

# tun0 IP straight from the kernel, and the current box from the state file
# htb-box writes. Both refresh on status-interval.
set -g status-right "#[fg=#{MOCHA_OVERLAY}]#(cat ~/.htb/box 2>/dev/null && echo ' ')#[fg=#{MOCHA_GREEN}]#(ip -o -4 addr show 2>/dev/null | awk '$2 ~ /^tun[0-9]+$/ {split($4,a,\"/\"); print \"󰖂 \" a[1]; exit}') #[fg=#{MOCHA_SURFACE1}]│ #[fg=#{MOCHA_SUBTEXT}]%H:%M "

setw -g window-status-format "#[fg=#{MOCHA_OVERLAY}] #I #W "
setw -g window-status-current-format "#[bg=#{MOCHA_SURFACE0},fg=#{MOCHA_LAVENDER},bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#{MOCHA_SURFACE0}"
set -g pane-active-border-style "fg=#{MOCHA_LAVENDER}"
set -g message-style "bg=#{MOCHA_SURFACE0},fg=#{MOCHA_TEXT}"
set -g mode-style "bg=#{MOCHA_SURFACE1},fg=#{MOCHA_TEXT}"

# --- plugins ---------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

if-shell '[ -f ~/.tmux/plugins/tpm/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
